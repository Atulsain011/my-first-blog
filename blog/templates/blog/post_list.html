{% extends 'blog/base.html' %}
{% block content %}
<form method="get" action="/blog/" class="mb-4" role="search">
    <div class="input-group">
        <input type="search" name="search" class="form-control"
            placeholder="Search blogs by title, text, author, category or tag" aria-label="Search blogs">
        <button class="btn btn-primary" type="submit">Search</button>
        <a class="btn btn-outline-secondary" id="search-clear-btn" href="{% url 'post_list' %}"
            style="display: none;">Clear</a>
    </div>
</form>

<div id="posts-container">
    <p class="text-muted">Loading blogs...</p>
</div>

<script>
    const searchForm = document.querySelector('form[role="search"]');
    async function loadPosts() {
        const postsContainer = document.getElementById('posts-container');
        const clearBtn = document.getElementById('search-clear-btn');
        postsContainer.innerHTML = '<p class="text-muted">Loading blogs...</p>';

        const path = window.location.pathname;
        const params = new URLSearchParams(window.location.search);
        const searchVal = params.get('search') || '';

        // Build API query URL params
        const apiParams = new URLSearchParams();

        // 1. Check path-based filters
        if (path.includes('/category/')) {
            const parts = path.split('/category/');
            const slug = parts[1].replace('/', '');
            apiParams.set('category', slug);
        } else if (path.includes('/tag/')) {
            const parts = path.split('/tag/');
            const slug = parts[1].replace('/', '');
            apiParams.set('tag', slug);
        }

        // 2. Add or override with query parameters from the URL
        const filterKeys = ['search', 'category', 'author', 'tag', 'slug'];
        filterKeys.forEach(key => {
            if (params.has(key)) {
                const val = params.get(key).trim();
                if (val) {
                    apiParams.set(key, val);
                }
            }
        });

        // Build API URL
        const queryString = apiParams.toString();
        const apiUrl = queryString ? `/api/posts/?${queryString}` : '/api/posts/';

        // Build user-friendly filter description text
        const filters = [];
        if (apiParams.has('category')) filters.push(`Category: ${apiParams.get('category')}`);
        if (apiParams.has('tag')) filters.push(`Tag: ${apiParams.get('tag')}`);
        if (apiParams.has('author')) filters.push(`Author: ${apiParams.get('author')}`);
        if (apiParams.has('search')) filters.push(`Search: "${apiParams.get('search')}"`);
        if (apiParams.has('slug')) filters.push(`Slug: ${apiParams.get('slug')}`);

        const filterText = filters.join(', ');

        if (clearBtn) {
            const hasQueryFilters = filterKeys.some(key => params.has(key) && params.get(key).trim());
            const hasPathFilters = path.includes('/category/') || path.includes('/tag/');
            clearBtn.style.display = (hasQueryFilters || hasPathFilters) ? 'inline-block' : 'none';
        }

        // Pre-fill search input if search value exists
        const searchInput = document.querySelector('input[name="search"]');
        if (searchInput) {
            searchInput.value = searchVal;
        }

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('Failed to fetch posts');
            const posts = await response.json();

            postsContainer.innerHTML = '';

            if (filterText) {
                const filterEl = document.createElement('h3');
                filterEl.className = 'mb-4';
                filterEl.textContent = `Showing posts for ${filterText}`;
                postsContainer.appendChild(filterEl);
            }

            if (posts.length === 0) {
                postsContainer.innerHTML += `<p>No blogs found${filterText ? ' for ' + filterText : ''}.</p>`;
                return;
            }

            posts.forEach(post => {
                const article = document.createElement('article');
                article.className = 'post';

                // Published date format
                let dateStr = '';
                if (post.published_date) {
                    const date = new Date(post.published_date);
                    dateStr = date.toLocaleString();
                }

                // Category HTML
                let categoryHtml = '';
                if (post.category) {
                    categoryHtml = `
                                <p>
                                    <strong>Category:</strong> 
                                    <a href="/blog/category/${post.category.slug}/">${post.category.name}</a>
                                </p>
                            `;
                }

                // Tags HTML
                let tagsHtml = '';
                if (post.tags && post.tags.length > 0) {
                    const tagsList = post.tags.map(tag => `
                                <span>
                                    <a href="/blog/tag/${tag.slug}/" class="Tags">${tag.name}</a>
                                </span>
                            `).join(' ');
                    tagsHtml = `
                                <p>
                                    <strong>Tags:</strong>
                                    ${tagsList}
                                </p>
                            `;
                }

                // Image HTML
                let imageHtml = '';
                if (post.thumbnail_url) {
                    imageHtml = `<img src="${post.thumbnail_url}" width="50" style="border-radius: 10px; margin-bottom: 15px; display: block;">`;
                }

                // Format body text with line breaks
                const formattedText = post.text ? post.text.replace(/\n/g, '<br>') : '';

                article.innerHTML = `
                            <time class="date">
                                ${dateStr}
                            </time>
                            <h2><a class="break" href="/blog/${post.slug}/">
                                ${post.title}
                            </a></h2>
                            <p>By ${post.author}</p>
                            ${categoryHtml}
                            ${tagsHtml}
                            ${imageHtml}
                            <p class="break">${formattedText}</p>
                        `;
                postsContainer.appendChild(article);
            });
        } catch (err) {
            console.error(err);
            postsContainer.innerHTML = '<p class="text-danger">Error loading posts. Please try again.</p>';
        }
    }
    // Load posts from REST API when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        loadPosts();
    });

    if (searchForm) {
    searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(searchForm);
        const searchVal = formData.get('search').trim();

        const newUrl = new URL(window.location.href);
        if (searchVal) {
            newUrl.searchParams.set('search', searchVal);
        } else {
            newUrl.searchParams.delete('search');
        }
        window.history.pushState({}, '', newUrl);
        loadPosts();
    });
}

</script>
{% endblock %}
