{% extends 'blog/base.html' %}

{% block title %}Latest Articles | Atul Blogs{% endblock %}

{% block content %}
<!-- Search & Filter Bar -->
<div class="search-card mb-4">
    <form method="get" action="/blog/" role="search">
        <div class="input-group search-input-group">
            <input type="search" name="search" class="form-control"
                placeholder="Search articles by title, content, author, category, or tag..." aria-label="Search articles">
            <button class="btn btn-primary" type="submit">
                🔍 Search
            </button>
            <a class="btn btn-outline-secondary d-flex align-items-center ms-2" id="search-clear-btn" href="{% url 'post_list' %}"
                style="display: none; border-radius: 8px;">Clear Filter</a>
        </div>
    </form>
</div>

<!-- Posts Feed Container -->
<div id="posts-container">
    <div class="text-center py-5 text-muted">
        <div class="spinner-border text-primary mb-3" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p>Fetching articles...</p>
    </div>
</div>

<script>
    const searchForm = document.querySelector('form[role="search"]');

    async function loadPosts() {
        const postsContainer = document.getElementById('posts-container');
        const clearBtn = document.getElementById('search-clear-btn');
        postsContainer.innerHTML = `
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-primary mb-3" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Fetching articles...</p>
            </div>`;

        const path = window.location.pathname;
        const params = new URLSearchParams(window.location.search);
        const searchVal = params.get('search') || '';

        // Build API query URL params
        const apiParams = new URLSearchParams();
        apiParams.set('page_size', '100');

        if (path.includes('/category/')) {
            const parts = path.split('/category/');
            const slug = parts[1].replace('/', '');
            apiParams.set('category', slug);
        } else if (path.includes('/tag/')) {
            const parts = path.split('/tag/');
            const slug = parts[1].replace('/', '');
            apiParams.set('tag', slug);
        }

        const filterKeys = ['search', 'category', 'author', 'tag', 'tags', 'slug'];
        filterKeys.forEach(key => {
            if (params.has(key)) {
                const val = params.get(key).trim();
                if (val) {
                    apiParams.set(key, val);
                }
            }
        });

        const queryString = apiParams.toString();
        const apiUrl = queryString ? `/api/posts/?${queryString}` : '/api/posts/';

        const filters = [];
        if (apiParams.has('category')) filters.push(`Category: "${apiParams.get('category')}"`);
        if (apiParams.has('tag')) filters.push(`Tag: "${apiParams.get('tag')}"`);
        if (apiParams.has('tags')) filters.push(`Tag: "${apiParams.get('tags')}"`);
        if (apiParams.has('author')) filters.push(`Author: "${apiParams.get('author')}"`);
        if (apiParams.has('search')) filters.push(`Search: "${apiParams.get('search')}"`);
        if (apiParams.has('slug')) filters.push(`Slug: "${apiParams.get('slug')}"`);

        const filterText = filters.join(', ');

        if (clearBtn) {
            const hasQueryFilters = filterKeys.some(key => params.has(key) && params.get(key).trim());
            const hasPathFilters = path.includes('/category/') || path.includes('/tag/');
            clearBtn.style.display = (hasQueryFilters || hasPathFilters) ? 'inline-flex' : 'none';
        }

        const searchInput = document.querySelector('input[name="search"]');
        if (searchInput) {
            searchInput.value = searchVal;
        }

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('Failed to fetch posts');
            const data = await response.json();
            const posts = data.results || data;

            postsContainer.innerHTML = '';

            if (filterText) {
                const filterEl = document.createElement('h5');
                filterEl.className = 'mb-4 text-secondary font-weight-bold';
                filterEl.textContent = `Showing results for ${filterText}`;
                postsContainer.appendChild(filterEl);
            }

            if (!posts || posts.length === 0) {
                postsContainer.innerHTML += `
                    <div class="card p-5 text-center border-0 shadow-sm rounded-4">
                        <h4 class="text-muted mb-2">No articles found</h4>
                        <p class="text-secondary mb-0">Try clearing your filters or searching for something else.</p>
                    </div>`;
                return;
            }

            posts.forEach(post => {
                const article = document.createElement('article');
                article.className = 'post';

                let dateStr = '';
                if (post.published_date) {
                    const date = new Date(post.published_date);
                    dateStr = date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                }

                let categoryHtml = '';
                if (post.category) {
                    categoryHtml = `<a href="/blog/category/${post.category.slug}/" class="category-pill">${post.category.name}</a>`;
                }

                let tagsHtml = '';
                if (post.tags && post.tags.length > 0) {
                    const tagsList = post.tags.map(tag => `
                        <a href="/blog/tag/${tag.slug}/" class="Tags">#${tag.name}</a>
                    `).join('');
                    tagsHtml = `<div class="mt-2">${tagsList}</div>`;
                }

                let imageHtml = '';
                if (post.thumbnail_url) {
                    imageHtml = `<img src="${post.thumbnail_url}" class="post-thumbnail-img" alt="${post.title}">`;
                }

                const formattedText = post.text ? (post.text.length > 280 ? post.text.substring(0, 280) + '...' : post.text).replace(/\n/g, '<br>') : '';

                article.innerHTML = `
                    <div class="post-header-meta">
                        <div>${categoryHtml}</div>
                        <time class="date">📅 ${dateStr}</time>
                    </div>
                    <h2>
                        <a class="break" href="/blog/${post.slug}/">${post.title}</a>
                    </h2>
                    <div class="post-author">By <span>${post.author}</span></div>
                    ${imageHtml}
                    <p class="post-excerpt break">${formattedText}</p>
                    ${tagsHtml}
                    <div class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
                        <a href="/blog/${post.slug}/" class="btn btn-sm btn-outline-primary fw-semibold px-3 rounded-pill">Read Full Article &rarr;</a>
                    </div>
                `;
                postsContainer.appendChild(article);
            });
        } catch (err) {
            console.error(err);
            postsContainer.innerHTML = '<div class="alert alert-danger">Error loading articles. Please refresh or try again later.</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadPosts();
    });

    if (searchForm) {
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(searchForm);
            const searchVal = formData.get('search').trim();

            const newUrl = new URL(window.location.href);
            if (searchVal) {
                newUrl.searchParams.set('search', searchVal);
            } else {
                newUrl.searchParams.delete('search');
            }
            window.history.pushState({}, '', newUrl);
            loadPosts();
        });
    }
</script>
{% endblock %}
