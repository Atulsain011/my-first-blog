<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>{% block title %}Django Auth{% endblock %}</title>
</head>

<body>
  <main>
    {% block content %}
    {% endblock %}
    {% if user.is_authenticated %}

    <span>Hi, {{ user.username }}</span>

    <a href="{% url 'profile' %}">Profile</a>

    {% if user.is_superuser %}
        <a href="/admin/">Admin Panel</a>
    {% endif %}
 
{% else %}

    <a href="{% url 'login' %}">Login</a>
  
{% endif %}
  </main>
</body>

</html>
