{% extends "blog/base.html" %}

{% block content %}

<h2>Edit Profile</h2>

{% if user.image and user.image.name != "default.jpg" %}

<div style="margin-bottom:20px;">
    <img src="{{ user.image.url }}"
         width="150"
         height="150"
         style="
            border-radius:10px;
            object-fit:cover;
            border:2px solid #ddd;
         ">

<br><br>

<a href="{% url 'delete_profile_image' %}"
   onclick="return confirm('Delete profile image?')"
   style="
        background:#dc3545;
        color:white;
        padding:8px 15px;
        text-decoration:none;
        border-radius:5px;
   ">
   Delete Photo
</a>

</div>
{% endif %}

<form method="post"
      enctype="multipart/form-data"
      class="post-form">

{% csrf_token %}

{{ form.as_p }}

<button type="submit" class="btn btn-primary">
    Save Changes
</button>

</form>

{% endblock %}
